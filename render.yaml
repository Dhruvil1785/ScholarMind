services:
  - type: web
    name: nextgen-ai-chatbot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: WORKING_MEMORY_TURNS
        value: "12"
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_store
